<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>VTOP Student Login</title>
  <meta name="_csrf" content="f9e8d7c6-b5a4-3210-fedc-ba9876543210">
</head>
<body>
  <!--
    Returned by: POST /vtop/prelogin/setup  (flag=VTOP)
    This is the actual student login form with captcha.

    Key elements the scraper must extract:
    - _csrf token (meta tag or hidden input)
    - Captcha image: <img> inside div#captchaBlock, src is data:image/png;base64,...
    - Form fields: username, password, captchaStr, gResponse (mirrors captchaStr)
  -->

  <div class="page-container">
    <h2>Student Login</h2>

    <form id="vtopLoginForm" method="POST" action="/vtop/login">
      <input type="hidden" name="_csrf" value="f9e8d7c6-b5a4-3210-fedc-ba9876543210">

      <div class="form-group">
        <label for="username">Registration Number / User ID</label>
        <input type="text" id="username" name="username" placeholder="e.g. 21BCE1234">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password">
      </div>

      <div id="captchaBlock">
        <label>Enter the characters shown below</label>
        <!-- The captcha image is always inline base64 PNG.
             This is a 1x1 pixel placeholder; real captchas are ~150x50 px. -->
        <img id="captchaImg"
             src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAAC0lEQVQIHWNgAAIABQABNjN9GQAAAAlwSFlzAAAWJQAAFiUBSVIk8AAAABl0RVh0Q29tbWVudABDcmVhdGVkIHdpdGggR0lNUFeBDhcAAAANSURBVAjXY2BgYPgPAAEEAQB9ssjqAAAAAElFTkSuQmCC"
             alt="Captcha Image">
        <input type="text" id="captchaStr" name="captchaStr" placeholder="Enter captcha">
        <input type="hidden" name="gResponse" id="gResponse">
      </div>

      <!-- Dormant reCAPTCHA field (always present, but only active when
           VTOP serves a Google reCAPTCHA instead of the image captcha).
           Check for data-sitekey attribute to detect active reCAPTCHA. -->
      <input type="hidden" name="g-recaptcha-response" id="g-recaptcha-response" value="">

      <button type="submit">Sign In</button>
    </form>
  </div>
</body>
</html>
