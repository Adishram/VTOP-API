openapi: 3.0.3
info:
  title: VTOP Backend API
  description: A clean JSON API bridging the VIT Chennai VTOP student portal for custom frontends.
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Local development server
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    UnauthorizedError:
      description: Session expired or invalid token
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
                example: "error"
              data:
                nullable: true
              error:
                type: string
                example: "VTOP_SESSION_EXPIRED"
security:
  - bearerAuth: []
paths:
  /api/login:
    post:
      summary: Initiate login and fetch CAPTCHA
      security: []
      responses:
        '200':
          description: CAPTCHA base64 and temporary session ID
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ok"
                  data:
                    type: object
                    properties:
                      login_session_id:
                        type: string
                      captcha_base64:
                        type: string
                  error:
                    nullable: true
  /api/login/verify:
    post:
      summary: Verify credentials and CAPTCHA
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                login_session_id:
                  type: string
                username:
                  type: string
                password:
                  type: string
                captcha_text:
                  type: string
      responses:
        '200':
          description: Returns a JWT for API authorization
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ok"
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                  error:
                    nullable: true
  /api/attendance:
    get:
      summary: Get student attendance
      parameters:
        - in: query
          name: semester
          schema:
            type: string
          description: VTOP semester sub ID (e.g., CH2025261)
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
  /api/timetable:
    get:
      summary: Get registered courses and timetable slots
      parameters:
        - in: query
          name: semester
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
  /api/marks:
    get:
      summary: Get detailed marks (CAT, FAT, assignments)
      parameters:
        - in: query
          name: semester
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
  /api/exams:
    get:
      summary: Get exam schedule (Dates, slots, venue)
      parameters:
        - in: query
          name: semester
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
  /api/grades:
    get:
      summary: Get historical grades and CGPA
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
  /api/calendar:
    get:
      summary: Get academic calendar events
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
  /api/courses:
    get:
      summary: Get list of available semesters for the student
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
  /api/faculty:
    get:
      summary: Get student profile and faculty advisor info
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
